<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Desarrollo API Chat con NodeJS</title>

  <link rel="stylesheet" href="styles.css">

</head>

<body>

  <div class="container">

    <h1>Chat App</h1>

    <!-- USUARIOS -->

    <section class="card">

      <h2>Crear Usuario</h2>

      <input type="text" id="name" placeholder="Nombre">

      <input type="email" id="email" placeholder="Email">

      <button onclick="createUser()">
        Crear Usuario
      </button>

    </section>

    <section class="card">

      <h2>Usuarios</h2>

      <button onclick="getUsers()">
        Cargar Usuarios
      </button>

      <ul id="usersList"></ul>

    </section>

    <!-- CHATS -->

    <section class="card">

      <h2>Crear Chat</h2>

      <input type="text" id="chatName" placeholder="Nombre del chat">

      <button onclick="createChat()">
        Crear Chat
      </button>

    </section>

<section class="card">

  <h2>Chats</h2>

  <button onclick="getChats()">
    Cargar Chats
  </button>

  <ul id="chatsList"></ul>

</section>

    <!-- MENSAJES -->

    <section class="card">

      <h2>Mensajes</h2>

      <div id="messages"></div>

      <select id="userSelect"></select>

      <input type="text" id="messageInput" placeholder="Escribir mensaje">

      <button onclick="sendMessage()">
        Enviar
      </button>

    </section>

  </div>

  <script src="app.js"></script>

</body>

</html>
